[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "patrick-agent"
version = "0.2.0"
description = "A local-first AI agent reference implementation built on local-agent-kit. Six tools, Karpathy-style eval, runs on consumer hardware."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Benjamin Easington", email = "bene-art@users.noreply.github.com"},
]
keywords = ["ai", "agent", "local", "ollama", "eval", "telegram", "sovereign", "patrick"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "local-agent-kit @ git+https://github.com/bene-art/local-agent-kit@main",
    "aiohttp>=3.9",
    "httpx>=0.27",
    "requests>=2.31",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/bene-art/patrick-agent"
Kit = "https://github.com/bene-art/local-agent-kit"
WhitePaper = "https://github.com/bene-art/patrick-agent/blob/main/docs/white_paper_v2.md"

[tool.setuptools.packages.find]
include = ["patrick_agent*"]
