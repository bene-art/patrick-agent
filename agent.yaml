name: Patrick
model: gemma3:12b
temperature: 0.4
max_tokens: 350

ollama_host: http://localhost:11434

# Patrick's tool router covers web_search itself (vendored Gemini
# grounding in patrick_agent/tools/web_search.py), so the kit's built-in
# search stays off to avoid double-calling. The channel is chosen at
# launch: scripts/run_patrick.py --channel cli|telegram.
search:
  provider: none

conversation_memory:
  enabled: true
  max_history: 20

tools:
  web_search: true
