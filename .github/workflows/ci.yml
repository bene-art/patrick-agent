name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install package + lint tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install ruff==0.15.21 mypy pre-commit

      - name: Ruff
        run: ruff check patrick_agent/ tests/ scripts/ eval/

      - name: Mypy
        run: mypy --ignore-missing-imports patrick_agent/

      # The privacy gate (secrets scan + hashed vocab scrub) must run in
      # CI, not just on machines with pre-commit installed.
      - name: Pre-commit hooks
        run: pre-commit run --all-files

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify imports
        run: |
          python -c "from patrick_agent.tools.tool_router import route_tools; print('tool_router OK')"
          python -c "from patrick_agent.tools.api_call import api_call; print('api_call OK')"
          python -c "from patrick_agent.notify.formatter import fmt_report, fmt_alert; print('notify OK')"
          python -c "from patrick_agent.notify.base import Channel, Severity; print('notify base OK')"

      - name: Validate Python syntax
        run: python -m compileall -q patrick_agent/ eval/ scripts/

      - name: Run tests
        run: pytest -q tests/
